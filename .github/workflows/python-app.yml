name: 每日股票分析

on:
  schedule:
    - cron: '30 1,3,7 * * 1-5'
  workflow_dispatch:

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}

jobs:
  analyze-stocks:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出代码
      uses: actions/checkout@v4
    
    # 2. 设置Python环境
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # 3. 安装依赖
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas akshare
    
    # 4. 运行股票分析
    - name: 运行股票分析
      run: |
        echo "开始运行股票分析脚本..."
        python stock_analysis.py
        
        echo "=== 生成的文件 ==="
        ls -la *.html *.txt 2>/dev/null || echo "未找到报告文件"
    
    # 5. 准备GitHub Pages文件（修复版）
    - name: 准备Pages文件
      run: |
        echo "开始准备GitHub Pages..."
        
        # 创建发布目录
        mkdir -p docs
        
        # 查找最新的HTML报告
        echo "查找HTML报告文件..."
        
        # 查找HTML文件，处理找不到文件的情况
        HTML_FILES=$(find . -maxdepth 1 -name "stock_report_*.html" -type f 2>/dev/null | wc -l)
        
        if [ "$HTML_FILES" -gt 0 ]; then
          # 找到HTML文件，复制到发布目录
          LATEST_HTML=$(ls -t stock_report_*.html | head -1)
          echo "找到HTML报告: $LATEST_HTML"
          
          cp "$LATEST_HTML" docs/index.html
          
          echo "✅ 已准备HTML报告: $LATEST_HTML"
        else
          echo "⚠️ 未找到HTML报告文件，创建简单页面"
          
          # 使用简单的echo命令创建页面
          echo '<!DOCTYPE html>' > docs/index.html
          echo '<html><head><title>股票分析报告</title>' >> docs/index.html
          echo '<style>body{font-family:Arial;margin:40px}h1{color:#333}</style>' >> docs/index.html
          echo '</head><body>' >> docs/index.html
          echo '<h1>📊 股票分析报告</h1>' >> docs/index.html
          echo '<p>报告正在生成中，请稍后刷新页面...</p>' >> docs/index.html
          echo '<p><small>生成时间: '$(date)'</small></p>' >> docs/index.html
          echo '</body></html>' >> docs/index.html
          
          echo "✅ 简单页面已创建"
        fi
        
        echo "=== docs目录内容 ==="
        ls -la docs/
    
    # 6. 部署到GitHub Pages
    - name: 部署到GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        keep_files: false
    
    # 7. 发送微信通知
    - name: 发送微信通知
      if: success()
      env:
        WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
      run: |
        echo "准备发送微信通知..."
        
        # 获取仓库信息
        REPO_NAME="${{ github.repository }}"
        USER_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
        REPO_NAME_ONLY=$(echo "$REPO_NAME" | cut -d'/' -f2)
        
        # 构建GitHub Pages链接
        PAGES_URL="https://${USER_NAME}.github.io/${REPO_NAME_ONLY}/"
        
        echo "GitHub Pages链接: $PAGES_URL"
        
        # 发送微信消息
        if [ -n "$WECHAT_TOKEN" ]; then
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$WECHAT_TOKEN\",
              \"title\": \"📈 股票分析报告已发布\",
              \"content\": \"股票分析报告已生成并发布到GitHub Pages<br><br>🔗 查看地址: <a href='$PAGES_URL'>$PAGES_URL</a><br><br>点击链接查看完整分析报告\",
              \"template\": \"html\"
            }" \
            "http://www.pushplus.plus/send"
          echo "✅ 微信通知已发送"
        else
          echo "⚠️ 未设置WECHAT_TOKEN，跳过微信通知"
        fi
    
    # 8. 上传报告文件（用于调试）
    - name: 上传报告文件
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stock-reports
        path: |
          stock_report_*.*
          *.log
        retention-days: 7
