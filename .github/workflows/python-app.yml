name: 股票分析及自动发布
on:
  schedule:
    - cron: '0 6 * * 0-5' # 交易日运行
  workflow_dispatch: # 允许手动触发

# 为整个工作流设置写入权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # 这行可生成后续可用的URL变量

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests pandas akshare

      - name: 运行分析脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python stock_analysis.py

      - name: 准备页面文件
        run: |
          # 创建发布目录
          mkdir -p _site
          # 查找最新生成的HTML报告
          if ls stock_report_*.html 1> /dev/null 2>&1; then
            cp $(ls -t stock_report_*.html | head -1) _site/index.html
            echo "✅ 已复制最新报告"
          else
            # 创建兜底页面
            echo '<h1>报告生成中...</h1>' > _site/index.html
          fi

      - name: 设置Pages
        uses: actions/configure-pages@v4

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 此步骤会自动生成 page_url

      - name: 发送微信通知（带链接）
        if: success()
        env:
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # 如果上一步生成了URL，则使用它；否则回退到手动拼接
          FINAL_URL="${PAGE_URL}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "最终访问地址: $FINAL_URL"
          
          # 发送微信消息
          curl -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$WECHAT_TOKEN\",
              \"title\": \"📈 股票报告已发布（可访问）\",
              \"content\": \"股票分析报告已成功部署并可访问！<br><br>🔗 <a href=\'$FINAL_URL\'>点击此处查看完整报告</a>\",
              \"template\": \"html\"
            }"
